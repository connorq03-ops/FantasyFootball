# FantasyFootball — 10-team, 2-QB (superflex) dynasty/keeper auction league.
#
# This file is the SINGLE place the league format is defined. Every client
# method and prefetch call defaults to `api_filters` below, so the wrong
# format (1-QB, standard scoring, redraft) cannot be pulled by accident.

api:
  base_url: https://api.fantasypros.com/public/v2/json
  # Header name used for auth. FantasyPros uses x-api-key (NOT Bearer, NOT ?key=).
  auth_header: x-api-key
  timeout_seconds: 30
  # Premium tier allows 1 request/second — the client sleeps to respect this.
  min_interval_seconds: 1.0

# ── LEAGUE API FILTERS (CRITICAL) ────────────────────────────────────────────
# scoring: PPR (full point). Other valid values: HALF, STD.
# position: OP = "Offensive Player" (superflex). Prices QBs at true 2-QB value.
#           Do NOT use ALL — that returns 1-QB rankings which undervalue QBs.
# type: dynasty so valuations reflect keeper/dynasty, not redraft.
api_filters:
  sport: NFL
  scoring: PPR
  position: OP
  type: dynasty
  season: 2026
  week: 0
  # ADP is only published for position=ALL — the superflex (OP) filter returns
  # zero ADP rows. ADP is informational only; the board baseline stays on the
  # OP dynasty rankings, so this does not leak 1-QB pricing into values.
  adp_position: ALL

# Per-position pulls (used for position depth / sanity checks only). The
# OVERALL board baseline always comes from the superflex (OP) rankings.
per_position_filters:
  positions: [QB, RB, WR, TE]

cache:
  db_path: .fantasypros_cache.db
  # 24h TTL: one daily prefetch serves every downstream board build.
  default_ttl_seconds: 86400
  snapshot_dir: snapshots

rate_limit:
  # HARD CONSTRAINT: daily call budget on a rolling 24h window.
  # Premium key: 500/day. Free key: 50/day (set max_calls: 50 if downgraded).
  api_name: fantasypros
  max_calls: 500
  window_seconds: 86400

league:
  teams: 10
  keepers_per_team: 3
  starting_budget: 200
  # Only teams x roster_size players are ever rostered, so the pot is solved
  # over that many available players. Everyone deeper is carried at $0 (waiver
  # fodder) instead of soaking up $1 apiece of a pot that has real bids to fund.
  draft_pool:
    enabled: true
    roster_size: 15
  # Superflex / 2-QB starting lineup, used by the optional position sanity check.
  roster_slots:
    QB: 2
    RB: 2
    WR: 3
    TE: 1
    FLEX: 1

# ── SOURCE BASELINE (HELD FIRM) ──────────────────────────────────────────────
# FP_Baseline is an ABSOLUTE auction dollar value computed from FantasyPros
# consensus projections (value over replacement -> dollars) for the reference
# format below. It is a property of the FORMAT (superflex, PPR, $200 x 10),
# not of this season's league state: keepers, sold players and the remaining
# pot must never move it. All league-specific effects (scarcity, keeper
# inflation, draft pool, pot reconciliation) live downstream in RawAdj /
# MarketScalar / FinalAdj.
baseline_auction:
  teams: 10
  budget: 200
  roster_size: 15
  # Draft Wizard slots: superflex = the base QB slot plus a QB/WR/RB/TE slot.
  # Bench is roster_size minus the starters, so the whole roster is funded.
  slots: {QB: 1, RB: 2, WR: 3, TE: 1, DST: 0, K: 0, QB/WR/RB/TE: 1}
  # Full PPR, in Draft Wizard's raw scoring fields (see fp_auction.py).
  scoring: {recWR: 1, recRB: 1, recTE: 1, passTD: 4}
  # Fallback only (auction_values.py), used when fp_auction_values.csv is absent.
  starters: {QB: 2, RB: 2, WR: 3, TE: 1, FLEX: 1}
  flex_positions: [RB, WR, TE]
  positions: [QB, RB, WR, TE]
  min_bid: 1

value_model:
  # Baseline site columns averaged into Avg_Baseline. Add more sites here and
  # they are averaged automatically (missing values are ignored).
  #
  # Both baselines are stored exactly as published and never rescaled. They are
  # quoted in different pots (FantasyPros $2,000 over its 148-player pool, Draft
  # Sharks $2,525 over 250), which is fine: the level difference is absorbed by
  # MarketScalar when the board is solved against THIS league's pot, while the
  # average of the two decides relative worth. Where a site does not price a
  # player at all the other site carries the row alone.
  baseline_columns: [FP_Baseline, DS_Baseline, ESPN_Baseline]

  # PremiumFactor = SCARCITY premium within the available pool, as a smooth
  # curve of RankAvail: 1 + (peak - 1) * exp(-(rank - 1) / decay).
  # Seeded to reproduce observed spreadsheet values (top ~1.4, next tier
  # ~1.2-1.25, most 1.0, deep tail 0.9).
  #
  # NOTE: superflex (OP) baselines ALREADY embed the 2-QB QB premium. Do NOT
  # add a blanket QB uplift here — that double-counts. position_multipliers
  # exist only for genuine pool-scarcity tweaks and default to 1.0.
  premium:
    peak: 1.40
    decay: 6.0
    tail_start_rank: 36
    tail_factor: 0.90
    round_digits: 3
    position_multipliers:
      QB: 1.0
      RB: 1.0
      WR: 1.0
      TE: 1.0

  # LowValueFactor: haircut applied to low-ranked players, else 1.0.
  low_value:
    factor: 0.80
    rank_cutoff: 60          # RankAvail strictly greater than this gets the haircut
    baseline_cutoff: null    # optional: Avg_Baseline below this also gets it

  # Pot-solving is the DEFAULT mode: MarketScalar = remaining_pot / sum(RawAdj).
  # "replication" mode reproduces the old spreadsheet's constant multipliers.
  mode: pot_solve
  replication:
    inflation_factor: 1.3
    scale: 0.9

  reconcile:
    min_value: 1             # $1 floor per available player
    enabled: true            # distribute rounding remainder so sum == pot

  # Tier buckets by FinalAdj (descending breakpoints, first match wins).
  tiers:
    - {name: "Tier 1", min_final_adj: 60}
    - {name: "Tier 2", min_final_adj: 35}
    - {name: "Tier 3", min_final_adj: 20}
    - {name: "Tier 4", min_final_adj: 10}
    - {name: "Tier 5", min_final_adj: 4}
    - {name: "Tier 6", min_final_adj: 0}

  # Optional report comparing summed value by position against expected
  # roster spend (10 teams x starting slots, incl. 2 QB).
  position_sanity_check: true

paths:
  keepers_csv: keepers.csv
  team_budgets_csv: team_budgets.csv
  espn_baselines_csv: espn_baselines.csv
  fp_auction_csv: fp_auction_values.csv
  draftsharks_csv: draftsharks.csv
  sold_csv: sold.csv
  output_dir: output
